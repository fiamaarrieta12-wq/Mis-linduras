<style>
:root{--bg:#fffdf8;--card:#fff;--ink:#2e2418;--muted:#8c7f6c;--line:#ece1c9;--gold:#a9802a;--gold2:#cba24b;--soft:#faf3e3;--bad:#a8352a;--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg) radial-gradient(60% 40% at 50% 0,#fbf1d8 0,transparent 70%) no-repeat;color:var(--ink);font:16px/1.55 var(--sans);max-width:560px;margin:0 auto;padding:0 18px 64px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
header{text-align:center;padding:26px 0 18px}
header img{width:210px;max-width:62vw;height:auto;mix-blend-mode:multiply;display:block;margin:0 auto}
header.sm img{width:120px}
header p{font:600 11px var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-top:2px}
header p::before,header p::after{content:"";display:inline-block;width:28px;height:1px;background:var(--gold2);vertical-align:middle;margin:0 12px}
.step,.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 22px;margin-bottom:16px;box-shadow:0 1px 0 #fff inset,0 10px 30px -18px rgba(120,86,20,.35)}
.step.off{opacity:.38;pointer-events:none}
#app.c{counter-reset:s}
#app.c .step h2::before{counter-increment:s;content:counter(s);display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--gold2);border-radius:50%;font:italic 500 17px var(--serif);color:var(--gold);margin-right:12px;vertical-align:4px}
h2{font:500 30px/1.1 var(--serif);letter-spacing:-.005em;margin-bottom:16px}
.ok{text-align:center}.ok h2{font-size:40px;line-height:1.05}.ok h2::before{content:none!important}
.grp{font:600 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:22px 0 4px}
.grp:first-of-type{margin-top:4px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 10px;cursor:pointer;transition:background .2s,padding .2s}
.opt:last-of-type{border-bottom:0}
.opt small{display:block;color:var(--muted);font-size:12.5px;letter-spacing:.02em}
.opt b{font:500 24px var(--serif);color:var(--gold);white-space:nowrap}
.opt b.q{font:500 italic 18px var(--serif)}
.opt.sel{background:var(--soft);border-radius:14px;border-bottom-color:transparent;box-shadow:inset 3px 0 0 var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:10px 18px;cursor:pointer;font-size:14.5px;text-align:center;transition:all .2s}
.chip:hover{border-color:var(--gold2)}
.chip small{display:block;font:italic 13px var(--serif);color:var(--muted)}
.chip.sel{background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:var(--gold);color:#fff}
.chip.sel small{color:#fff;opacity:.9}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:12px;font-size:16px}
input:focus{border-color:var(--gold);outline:0;box-shadow:0 0 0 3px rgba(203,162,75,.2)}
input::placeholder{color:#b3a794}
input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--gold);padding:0}
.cta{width:100%;border:0;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#fff;padding:16px;border-radius:99px;font:600 13px var(--sans);letter-spacing:.2em;text-transform:uppercase;cursor:pointer;margin-top:8px;box-shadow:0 10px 24px -12px rgba(169,128,42,.8);transition:transform .15s}
.cta:active{transform:scale(.98)}.cta:disabled{opacity:.45;cursor:not-allowed}
.ghost{border:1px solid var(--gold2);background:#fff;color:var(--gold);padding:8px 15px;border-radius:99px;cursor:pointer;font-size:13px;font-weight:500;text-decoration:none;display:inline-block}
.link{border:0;background:none;color:var(--bad);cursor:pointer;font-size:13px;text-decoration:underline;padding:4px}
.muted{color:var(--muted);font-size:13.5px}
.sum{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:18px;margin:18px 0;line-height:1.8}
.turno{display:flex;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:13px 0}
.hr{font:500 28px var(--serif);color:var(--gold);min-width:68px}
.row{display:flex;gap:10px}.row>*{flex:1}
.days{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.tabs{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;padding:10px 2px;border-radius:99px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted)}
.tabs button.sel{background:#fff;color:var(--gold);box-shadow:0 2px 8px -3px rgba(120,86,20,.4)}
.svc{border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;background:#fff}
.svc.inactive{background:#f6f3ec;opacity:.75}
.svc>input{font-weight:500}
.svc label.f{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em}
.svc label.f input{margin:4px 0 0}
.svc-act{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.svc-act label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.add{width:100%;margin-top:6px;padding:12px;border-style:dashed}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(255,253,248,.96);border-top:1px solid var(--line);display:none;z-index:5}
.savebar.show{display:block}
.savebar>div{max-width:560px;margin:0 auto}
.savebar .cta{margin:0}
.savebar span{display:block;text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:6px}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:var(--ink);color:#fff;padding:11px 22px;border-radius:99px;font-size:14px;transition:transform .35s;z-index:9}
#toast.show{transform:translate(-50%,0)}
textarea{resize:vertical;font-family:inherit;line-height:1.4}
.chk{display:flex;gap:10px;align-items:center;margin:4px 0 12px;font-size:14.5px}
.pin{background:var(--soft);border:1px solid var(--gold2);border-radius:22px;padding:20px 20px 16px;margin-bottom:16px}
.pin .tag{font:600 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.pin p{font:500 22px/1.3 var(--serif);white-space:pre-line;margin-bottom:14px}
.pin .rr{display:flex;gap:8px}.pin .rr input{margin:0;flex:1;min-width:0}
.pin .rr button{border:0;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#fff;border-radius:12px;padding:0 16px;font-weight:600;font-size:14px;cursor:pointer}
.wa-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:#1f9d55;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);z-index:4}
a{color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

async function req(path,opt){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);
  try{
    const r=await fetch(SUPABASE_URL+path,{...opt,signal:c.signal,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'}});
    const tx=await r.text();let j=null;try{j=tx?JSON.parse(tx):null}catch(e){}
    return r.ok?{data:j,error:null}:{data:null,error:{message:(j&&j.message)||'Error '+r.status}};
  }catch(e){return{data:null,error:{message:'Sin conexión'}}}finally{clearTimeout(t)}
}

  const T=lsGet('ml_demo_appts',[]),m=h=>+h.split(':')[0]*60+ +h.split(':')[1],ok=d=>({data:d,error:null});

  if(n==='admin_set_pin'){lsSet('ml_demo_pin',a.p_new);return ok(null)}
  return ok(null);
}

const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const toStr=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fromYmd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const longDate=s=>fromYmd(s).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
function slots(w,date,dur){
  if(!w.days.includes(fromYmd(date).getDay()))return [];
  const busy=S.appts.filter(a=>a.wid===w.id&&a.date===date).map(a=>[toMin(a.time),toMin(a.time)+a.dur]);
  const now=new Date(),isToday=ymd(now)===date,nowM=now.getHours()*60+now.getMinutes()+30,out=[];
  for(let t=toMin(w.from);t+dur<=toMin(w.to);t+=30){
    if(isToday&&t<nowM)continue;
    if(busy.every(([a,b])=>t+dur<=a||t>=b))out.push(toStr(t));
  }
  return out;
}

  const list=B.wid==='any'?ws:ws.filter(w=>w.id===B.wid),set=new Set();

}

  q('[data-dw]',b=>b.onclick=()=>{const[i,n]=b.dataset.dw.split(':').map(Number),d=S.workers[i].days,x=d.indexOf(n);x<0?d.push(n):d.splice(x,1);save();renderA()});
  q('[data-cw]',b=>b.onclick=()=>{const[i,c]=b.dataset.cw.split(':'),d=S.workers[i].cats,x=d.indexOf(c);x<0?d.push(c):d.splice(x,1);save();renderA()});
  q('[data-del]',b=>b.onclick=()=>{const w=S.workers[b.dataset.del];if(confirm('¿Quitar a '+w.name+'? Sus turnos futuros también se borran.')){S.appts=S.appts.filter(a=>a.wid!==w.id);S.workers.splice(b.dataset.del,1);save();renderA()}});
  const aw=$('#addw');if(aw)aw.onclick=()=>{S.workers.push({id:'w'+Date.now(),name:'Nueva',days:[1,2,3,4,5],from:'10:00',to:'18:00',cats:['dep','zon']});save();renderA()};
  const sp=$('#svp');if(sp)sp.onclick=()=>{const v=$('#np').value.trim();if(v.length>=4){db.rpc('admin_set_pin',{p_pin:PIN,p_new:v}).then(({error})=>{if(error)alert(error.message);else{PIN=v;alert('PIN actualizado')}})}else alert('Mínimo 4 dígitos')};
}
